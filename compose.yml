services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maplehelper
      POSTGRES_USER: maplehelper
      POSTGRES_PASSWORD: maplehelper
    ports:
      - "5433:5432"
    volumes:
      - maplehelper-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maplehelper -d maplehelper"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maplehelper-postgres:
