spring:
  application:
    name: maplehelper-backend
  r2dbc:
    url: r2dbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5433}/${DATABASE_NAME:maplehelper}
    username: ${DATABASE_USERNAME:maplehelper}
    password: ${DATABASE_PASSWORD:maplehelper}
  flyway:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5433}/${DATABASE_NAME:maplehelper}
    user: ${DATABASE_USERNAME:maplehelper}
    password: ${DATABASE_PASSWORD:maplehelper}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

maplehelper:
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:3000}
  nexon-rankings:
    base-url: https://www.nexon.com
    user-agent: MapleHelper/0.1 (+https://github.com/)
  ocr:
    tesseract-command: ${TESSERACT_COMMAND:tesseract}
  cv:
    python-command: ${PYTHON_COMMAND:python}
    star-counter-script: ${STAR_COUNTER_SCRIPT:scripts/count_starforce.py}
    flame-extractor-script: ${FLAME_EXTRACTOR_SCRIPT:scripts/extract_flame_stats.py}
    stat-equivalency-extractor-script: ${STAT_EQUIVALENCY_EXTRACTOR_SCRIPT:scripts/extract_stat_equivalencies.py}
    equipment-ocr-preprocessor-script: ${EQUIPMENT_OCR_PREPROCESSOR_SCRIPT:scripts/preprocess_equipment_ocr.py}
